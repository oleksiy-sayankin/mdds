# Keep Argo Workflows, Workflow Pods, and their artifact credentials together.
# The Argo HelmChart also has createNamespace enabled; declaring the namespace
# here makes it available before the other bootstrap manifests are processed.
apiVersion: v1
kind: Namespace
metadata:
  name: argo
  labels:
    app.kubernetes.io/part-of: mdds-demo
---
# Isolate MinIO, its persistent volume, and its administrative credentials from
# Workflow Pods.
apiVersion: v1
kind: Namespace
metadata:
  name: mdds-storage
  labels:
    app.kubernetes.io/part-of: mdds-demo
---
# Demo-only MinIO administrator credentials. This Secret is mounted only into
# MinIO and the one-time bootstrap Job.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root-credentials
  namespace: mdds-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: mdds-demo
type: Opaque
stringData:
  rootUser: mdds-minio-root
  rootPassword: mdds-minio-root-password-change-me
---
# Restricted credentials used by the MinIO bootstrap Job to create the
# platform identity. Kubernetes Secrets cannot be referenced across
# namespaces, so the same identity is also declared in the argo namespace.
apiVersion: v1
kind: Secret
metadata:
  name: mdds-object-storage-credentials
  namespace: mdds-storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: mdds-demo
type: Opaque
stringData:
  accessKey: mdds-platform
  secretKey: mdds-platform-secret-key-change-me
---
# Restricted S3 credentials for Argo artifact init/wait containers. Do not
# mount this Secret into the user-provided Worker container.
apiVersion: v1
kind: Secret
metadata:
  name: mdds-object-storage-credentials
  namespace: argo
  labels:
    app.kubernetes.io/name: argo-workflows
    app.kubernetes.io/component: artifact-storage
    app.kubernetes.io/part-of: mdds-demo
type: Opaque
stringData:
  accessKey: mdds-platform
  secretKey: mdds-platform-secret-key-change-me
